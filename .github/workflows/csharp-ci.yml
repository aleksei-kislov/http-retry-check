name: C# CI

on:
  pull_request:
    paths:
      - .gitattributes
      - .github/workflows/csharp-ci.yml
      - global.json
      - csharp/**
      - conformance/http-retry-check/v1/**
      - schemas/v1/**
      - pkg/httpcheck/v1/**
      - internal/scenariosuite/v1/**
      - internal/httpcheck/v1/**
      - third_party/licenses/microsoft-test-platform/**
      - third_party/licenses/mstest/**
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - .gitattributes
      - .github/workflows/csharp-ci.yml
      - global.json
      - csharp/**
      - conformance/http-retry-check/v1/**
      - schemas/v1/**
      - pkg/httpcheck/v1/**
      - internal/scenariosuite/v1/**
      - internal/httpcheck/v1/**
      - third_party/licenses/microsoft-test-platform/**
      - third_party/licenses/mstest/**

permissions:
  contents: read

concurrency:
  group: csharp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_MULTILEVEL_LOOKUP: "0"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "true"

jobs:
  test:
    name: C# tests / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-24.04
          - label: Windows
            os: windows-2025
    steps:
      - name: Configure LF checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to disable checkout line-ending conversion.'
          }
          & git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to select LF checkout bytes.'
          }
          $autoCrlf = (& git config --global --get core.autocrlf | Out-String).Trim()
          $eol = (& git config --global --get core.eol | Out-String).Trim()
          if ($autoCrlf -cne 'false' -or $eol -cne 'lf') {
            throw 'Git checkout line-ending policy was not fixed to repository bytes.'
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
          submodules: false
          lfs: false

      - name: Prepare temporary .NET state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $stateRoot = Join-Path $runnerRoot 'http-retry-check-csharp'
          $statePaths = [ordered]@{
            DOTNET_CLI_HOME = Join-Path $stateRoot 'dotnet-cli-home'
            NUGET_PACKAGES = Join-Path $stateRoot 'nuget-packages'
            NUGET_HTTP_CACHE_PATH = Join-Path $stateRoot 'nuget-http-cache'
            NUGET_PLUGINS_CACHE_PATH = Join-Path $stateRoot 'nuget-plugins-cache'
          }

          foreach ($entry in $statePaths.GetEnumerator()) {
            $statePath = $entry.Value
            if ([string]::IsNullOrWhiteSpace($statePath)) {
              throw 'A required external .NET state path is empty.'
            }

            $fullPath = [IO.Path]::GetFullPath($statePath)
            $relativePath = [IO.Path]::GetRelativePath($runnerRoot, $fullPath)
            if (
              [IO.Path]::IsPathRooted($relativePath) -or
              $relativePath -eq '..' -or
              $relativePath.StartsWith("..$([IO.Path]::DirectorySeparatorChar)")
            ) {
              throw "External .NET state escaped the runner temporary directory: $fullPath"
            }
            if (Test-Path -LiteralPath $fullPath) {
              throw "External .NET state was not clean: $fullPath"
            }

            New-Item -ItemType Directory -Path $fullPath | Out-Null
            "$($entry.Key)=$fullPath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Validate global.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $globalJson = Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json
          $rootKeys = @($globalJson.PSObject.Properties.Name)
          $sdkKeys = @($globalJson.sdk.PSObject.Properties.Name)
          if (($rootKeys -join ',') -cne 'sdk') {
            throw 'global.json must contain only the sdk object.'
          }
          if (($sdkKeys -join ',') -cne 'version,rollForward,allowPrerelease') {
            throw 'global.json contains an unexpected SDK selection member.'
          }
          if (
            $globalJson.sdk.version -cne '10.0.303' -or
            $globalJson.sdk.rollForward -cne 'disable' -or
            $globalJson.sdk.allowPrerelease -isnot [bool] -or
            $globalJson.sdk.allowPrerelease
          ) {
            throw 'global.json does not contain the expected SDK selection.'
          }

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: false

      - name: Verify SDK and NuGet source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $selectedSdk = (& dotnet --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $selectedSdk -cne '10.0.303') {
            throw "Expected .NET SDK 10.0.303, got '$selectedSdk'."
          }

          $configPath = [IO.Path]::GetFullPath('csharp/NuGet.Config')
          $config = [Xml.Linq.XDocument]::Load($configPath)
          $root = $config.Root
          $sections = @($root.Elements())
          if (
            $root.Name.LocalName -cne 'configuration' -or
            @($root.Attributes()).Count -ne 0 -or
            (($sections | ForEach-Object { $_.Name.LocalName }) -join ',') -cne
              'packageSources,auditSources,packageSourceMapping,disabledPackageSources'
          ) {
            throw 'NuGet configuration contains an unexpected section.'
          }

          foreach ($index in @(0, 1)) {
            $children = @($sections[$index].Elements())
            $attributes = @($children[1].Attributes())
            if (
              @($sections[$index].Attributes()).Count -ne 0 -or
              $children.Count -ne 2 -or
              $children[0].Name.LocalName -cne 'clear' -or
              @($children[0].Attributes()).Count -ne 0 -or
              $children[1].Name.LocalName -cne 'add' -or
              (($attributes | ForEach-Object { $_.Name.LocalName }) -join ',') -cne
                'key,value,protocolVersion' -or
              (($attributes | ForEach-Object { $_.Value }) -join ',') -cne
                'nuget.org,https://api.nuget.org/v3/index.json,3'
            ) {
              throw "Unexpected NuGet source configuration in $($sections[$index].Name.LocalName)."
            }
          }

          $mapping = @($sections[2].Elements())
          $patterns = @($mapping[0].Elements())
          $disabled = @($sections[3].Elements())
          if (
            @($sections[2].Attributes()).Count -ne 0 -or
            @($sections[3].Attributes()).Count -ne 0 -or
            $mapping.Count -ne 1 -or
            $mapping[0].Name.LocalName -cne 'packageSource' -or
            @($mapping[0].Attributes()).Count -ne 1 -or
            $mapping[0].Attribute('key').Value -cne 'nuget.org' -or
            $patterns.Count -ne 1 -or
            $patterns[0].Name.LocalName -cne 'package' -or
            @($patterns[0].Attributes()).Count -ne 1 -or
            $patterns[0].Attribute('pattern').Value -cne '*' -or
            $disabled.Count -ne 1 -or
            $disabled[0].Name.LocalName -cne 'clear' -or
            @($disabled[0].Attributes()).Count -ne 0
          ) {
            throw 'NuGet source mapping or disabled-source configuration changed.'
          }

          $sources = @(& dotnet nuget list source --configfile csharp/NuGet.Config --format Short)
          if ($LASTEXITCODE -ne 0) {
            throw 'NuGet source enumeration failed.'
          }
          $sourceLines = @($sources | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if (
            $sourceLines.Count -ne 1 -or
            $sourceLines[0].Trim() -cne 'E https://api.nuget.org/v3/index.json'
          ) {
            throw "Unexpected enabled NuGet source: $($sourceLines -join '; ')"
          }

      - name: Restore locked dependencies
        run: >-
          dotnet restore csharp/HttpRetryCheck.slnx
          --locked-mode
          --configfile csharp/NuGet.Config
          --no-http-cache
          --verbosity minimal

      - name: Verify package signatures and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = [ordered]@{
            'microsoft.applicationinsights/2.23.0/microsoft.applicationinsights.2.23.0.nupkg' = 'e6c7f76e0ec26598c7b1e2be1777e839c84486655e8a878fc4c655bd2e918dbd'
            'microsoft.codecoverage/18.9.0/microsoft.codecoverage.18.9.0.nupkg' = '7ee6dac4627c176d819db2467f1f41ec355970a3ea1e8a6b8ba783ea072fc33d'
            'microsoft.net.test.sdk/18.9.0/microsoft.net.test.sdk.18.9.0.nupkg' = '3c19312754a299160bafcb192104c57719849f05589b3ae5fed2e21dbcf4f5b0'
            'microsoft.testing.extensions.telemetry/2.3.3/microsoft.testing.extensions.telemetry.2.3.3.nupkg' = '0e8a35200c270e56eaca0d90ea9f3646e618010ed59099d8e0f9fd30366a08eb'
            'microsoft.testing.extensions.trxreport.abstractions/2.3.3/microsoft.testing.extensions.trxreport.abstractions.2.3.3.nupkg' = '6008074b70742f046f2077abdbce50b92ad808ee45712a405daccbe693470786'
            'microsoft.testing.extensions.vstestbridge/2.3.3/microsoft.testing.extensions.vstestbridge.2.3.3.nupkg' = 'fd4970504230432359c5d0f48cd715df8649db468b7b6916413bc7dcb3881deb'
            'microsoft.testing.platform/2.3.3/microsoft.testing.platform.2.3.3.nupkg' = 'b07d00cab5f49f2d0981592044baef3d720a079e6941601c7790044584b3174a'
            'microsoft.testing.platform.msbuild/2.3.3/microsoft.testing.platform.msbuild.2.3.3.nupkg' = '25e537fbc39e6ce0c0da4e8a4a8ae6d8fee98ae41945d4b586124a03075f4890'
            'microsoft.testplatform.objectmodel/18.9.0/microsoft.testplatform.objectmodel.18.9.0.nupkg' = 'fd124e525502283802d2a67d00b7379d39bb9c66ba84592dcf19b73900ec708a'
            'microsoft.testplatform.testhost/18.9.0/microsoft.testplatform.testhost.18.9.0.nupkg' = '452242a8c198a1a4f45e54a28fa3c4ca3a80b9249bbcdf2c02fd9b818c02d1ee'
            'mstest.analyzers/4.3.3/mstest.analyzers.4.3.3.nupkg' = '780d8c8ac6ab5afc2e01d578f5676e61c9549c2fa159f1da4eddf9f54f827428'
            'mstest.testadapter/4.3.3/mstest.testadapter.4.3.3.nupkg' = '2701b1e104d3daffea29cb868353c2a80d383a7ac1e1e0d549449a3ba1be4e00'
            'mstest.testframework/4.3.3/mstest.testframework.4.3.3.nupkg' = '77f28f595ebc26e2e554ab70757b5f2c6fed049fdde1663d0d56357ce061a734'
          }
          $actual = @(Get-ChildItem -LiteralPath $env:NUGET_PACKAGES -Recurse -File -Filter '*.nupkg')
          if ($actual.Count -ne $expected.Count) {
            throw "Expected exactly $($expected.Count) package archives, found $($actual.Count)."
          }

          $author = '566A31882BE208BE4422F7CFD66ED09F5D4524A5994F50CCC8B05EC0528C1353'
          $repository = '1F4B311D9ACC115C8DC8018B5A49E00FCE6DA8E2855F9F014CA6F34570BC482D'
          foreach ($entry in $expected.GetEnumerator()) {
            $relative = $entry.Key.Replace('/', [IO.Path]::DirectorySeparatorChar)
            $archive = [IO.Path]::GetFullPath((Join-Path $env:NUGET_PACKAGES $relative))
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Required package archive is missing: $($entry.Key)"
            }
            $sha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha256 -cne $entry.Value) {
              throw "Package SHA-256 mismatch: $($entry.Key)"
            }

            $verification = (& dotnet nuget verify --all --verbosity minimal $archive 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or
                -not $verification.Contains($author, [StringComparison]::Ordinal) -or
                -not $verification.Contains($repository, [StringComparison]::Ordinal)) {
              throw "Package signature verification failed: $($entry.Key)"
            }
          }

      - name: Verify locked restore inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & git diff --exit-code -- `
            csharp/src/HttpRetryCheck/packages.lock.json `
            csharp/tests/HttpRetryCheck.Tests/packages.lock.json
          if ($LASTEXITCODE -ne 0) {
            throw 'Locked restore metadata drifted.'
          }

          $expectedSource = 'https://api.nuget.org/v3/index.json'
          $expectedConfig = [IO.Path]::GetFullPath('csharp/NuGet.Config')
          $trimChars = [char[]]@(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          )
          $expectedPackages = [IO.Path]::GetFullPath($env:NUGET_PACKAGES).TrimEnd($trimChars)
          $assetPaths = @(
            'csharp/src/HttpRetryCheck/obj/project.assets.json',
            'csharp/tests/HttpRetryCheck.Tests/obj/project.assets.json'
          )

          foreach ($assetPath in $assetPaths) {
            $assets = Get-Content -LiteralPath $assetPath -Raw | ConvertFrom-Json
            $sources = @($assets.project.restore.sources.PSObject.Properties.Name)
            $configs = @($assets.project.restore.configFilePaths)
            $packageFolders = @($assets.packageFolders.PSObject.Properties.Name)
            if ($sources.Count -ne 1 -or $sources[0] -cne $expectedSource) {
              throw "Unexpected restore source in $assetPath."
            }
            if (
              $configs.Count -ne 1 -or
              [IO.Path]::GetFullPath($configs[0]) -ne $expectedConfig
            ) {
              throw "Unexpected restore configuration in $assetPath."
            }
            if (
              $packageFolders.Count -ne 1 -or
              [IO.Path]::GetFullPath($packageFolders[0]).TrimEnd($trimChars) -ne $expectedPackages
            ) {
              throw "Restore packages escaped the configured external cache in $assetPath."
            }
          }

      - name: Build Release
        run: >-
          dotnet build csharp/HttpRetryCheck.slnx
          --configuration Release
          --no-restore
          --verbosity minimal

      - name: Run tests
        run: >-
          dotnet test csharp/tests/HttpRetryCheck.Tests/HttpRetryCheck.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --settings csharp/HttpRetryCheck.runsettings
          --verbosity normal
