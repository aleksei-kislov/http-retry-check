name: Go CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public_tree:
    name: Public tree guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject private development files
        shell: bash
        run: |
          if [[ -d findings || -e README.dev.md ]]; then
            printf '%s\n' 'private development files must not reach this repository'
            exit 1
          fi

  quality:
    name: Quality / Linux
    needs: public_tree
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require public tree guard
        if: ${{ needs.public_tree.result != 'success' }}
        shell: bash
        run: |
          printf '%s\n' 'private development files must not reach this repository'
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          check-latest: false
          cache: false

      - name: Verify Go version
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.6"

      - name: Verify module files
        run: |
          go mod verify
          go mod tidy -diff

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Verify semantic-version checkout
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/http-retry-check-version-probe"
          binary="$RUNNER_TEMP/http-retry-check-tagged"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test_tag="$GITHUB_REF_NAME"
          else
            test_tag="v0.999.999-ci"
          fi
          [[ "$test_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git init "$probe"
          git -C "$probe" fetch --no-tags --depth=1 "$GITHUB_WORKSPACE" HEAD
          git -C "$probe" checkout --detach FETCH_HEAD
          git -C "$probe" tag "$test_tag" HEAD
          cd "$probe"
          go build -o "$binary" ./cmd/http-retry-check
          test "$("$binary" version)" = "http-retry-check $test_tag"
          go test -count=1 ./cmd/http-retry-check

      - name: Cross-build supported and fallback platforms
        shell: bash
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=openbsd GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=plan9 GOARCH=amd64 CGO_ENABLED=0 go build ./...

  ordinary:
    name: Tests / ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          check-latest: false
          cache: false

      - name: Verify Go version
        shell: bash
        run: test "$(go env GOVERSION)" = "go1.26.6"

      - name: Run tests
        run: go test -p=1 -timeout=15m -count=1 ./...

  retryablehttp-example:
    name: go-retryablehttp example / Linux
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          check-latest: false
          cache: false

      - name: Verify Go version
        shell: bash
        run: test "$(go env GOVERSION)" = "go1.26.6"

      - name: Verify adapter module
        working-directory: examples/adapters/go-retryablehttp
        run: |
          go mod verify
          go mod tidy -diff
          go vet ./...

      - name: Run adapter example
        working-directory: examples/adapters/go-retryablehttp
        run: go test -count=1 ./...

  race:
    name: Race / Linux
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          check-latest: false
          cache: false

      - name: Verify Go version
        shell: bash
        run: test "$(go env GOVERSION)" = "go1.26.6"

      - name: Run race-enabled tests
        run: go test -p=1 -timeout=25m -count=1 -race ./cmd/... ./internal/... ./pkg/...
